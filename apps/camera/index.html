<!DOCTYPE html>
<html>
	<head>
		<title>Calculator</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
			* {
				font-family: Montserrat;
			}

			#canvas {
				display: none;
			}

			video {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}

			#start-button {
				position: fixed;
				bottom: 30px;
				left: 50%;
				transform: translateX(-50%);
			}
			#permissions-button {
				position: fixed;
				bottom: 30px;
				left: 50%;
				transform: translateX(-50%);
			}

			button {
				font-weight: 600;
				background-color: crimson;
				color: white;
				border-radius: 5px;
				padding: 5px;
				border: 0;
				border-bottom: 2px solid white;
				border-right: 2px solid white;
				cursor: pointer;
			}
			button:focus {
				border-bottom: 0px;
				border-right: 0px;
			}

			img {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: none;
			}
			a {
				color: black;
			}
		</style>
	</head>
	<body>


		<div class="camera">
		  <video id="video">Video stream not available.</video>
		  <button id="start-button">CAPUTRE</button>
		  <button id="permissions-button">ACTIVATE</button>
		</div>

		<canvas id="canvas"></canvas>
		<a id="photo" href="" download="file.png">c:</a>

		<script>
			const width = 320;
			let height = 0;

			let streaming = false;

			const video = document.getElementById("video");
			const canvas = document.getElementById("canvas");
			const photo = document.getElementById("photo");
			const startButton = document.getElementById("start-button");
			const allowButton = document.getElementById("permissions-button");

			allowButton.addEventListener("click", () => {
			  navigator.mediaDevices
			    .getUserMedia({ video: true, audio: false })
			    .then((stream) => {
			      video.srcObject = stream;
			      video.play();
			      allowButton.style.display = "none";
			    })
			    .catch((err) => {
			      console.error(`An error occurred: ${err}`);
			    });
			});

			video.addEventListener("canplay", (ev) => {
			  if (!streaming) {
			    height = video.videoHeight / (video.videoWidth / width);

			    video.setAttribute("width", width);
			    video.setAttribute("height", height);
			    canvas.setAttribute("width", width);
			    canvas.setAttribute("height", height);
			    streaming = true;
			  }
			});

			startButton.addEventListener("click", (ev) => {
			  takePicture();
			  ev.preventDefault();
			});

			function clearPhoto() {
			  const context = canvas.getContext("2d");
			  context.fillStyle = "#aaaaaa";
			  context.fillRect(0, 0, canvas.width, canvas.height);

			  const data = canvas.toDataURL("image/png");
			  photo.setAttribute("href", data);
			}

			clearPhoto();

			function takePicture() {
			  const context = canvas.getContext("2d");
			  if (width && height) {
			    canvas.width = width;
			    canvas.height = height;
			    context.drawImage(video, 0, 0, width, height);

			    const data = canvas.toDataURL("image/png");
			    /*photo.setAttribute("href", data);
			    photo.click();*/
			    const file = "image" + Math.floor(Math.random() * 10000).toString() + ".png";
			    parent.fsAddFile(file, data);
			    parent.preloadedFiles["desktop"].push(file);
			    parent.reRenderDesktop();
			  } else {
			    clearPhoto();
			  }
			}
		</script>
	</body>
</html>

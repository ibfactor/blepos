<!DOCTYPE html>
<html lang="en-us">
	<head>
	<meta charset="utf-8">
	 <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	 <title>8 Ball Pool</title>
	 <style type="text/css">
		iframe { 
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			font-family: sans-serif;
			border: 0;
			width: 901.15px;
			height: 600px;
		}
	 </style>
	</head>
	<body>
		 <iframe src="https://prod-web-pool.miniclip.com/mc?localmc"></iframe>

		 <script type="text/javascript">
		    function resizeHandler() {
		        const iframe = document.querySelector("iframe");

		        const scaleX = document.body.offsetWidth / 901.15;
		        const scaleY = window.innerHeight / 600;

		        iframe.style.zoom = Math.min(scaleX, scaleY);
		    }

		 	window.addEventListener("resize", resizeHandler)
		 	resizeHandler();
		 </script>
	</body>
</html>

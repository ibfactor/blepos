<!DOCTYPE html>
<html>
	<head>
		<title>Settings</title>
		<link rel="stylesheet" href="/assets/styles/main.css">
		<style>

			#sidebar {
				position: fixed;
				top: 0;
				left: 0;
				width: 20%;
				max-width: 200px;
				border-right: 0.5px solid #4a4a4a;
				height: 100%;
				padding-top: 0;
			}
			ul {
				padding: 0px;
				margin: 0;
			}
			ul, li {
				list-style: none;
				padding: 5px;
			}
			li {
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				font-size: 13px;
				cursor: pointer;
				transition: all 0.2s;
			}
			li:hover, li.active {
				background-color: rgba(255, 255, 255, 0.2);
			}
			li:nth-of-type(1) {
				border-bottom: 0.5px solid #4a4a4a;
			}
			input {
				background-color: rgba(0, 0, 0, 0);
				color: white;
				width: calc(100% - 8px);
				border: 0;
				font-family: "Montserrat";
			}
			input:focus {
				outline: 0;
			}
			li:has(input:focus) {
				background-color: rgba(255, 255, 255, 0.2);
			}
			#main {
				position: fixed;
				width: max(80%, 100% - 200px);
				left: min(20%, 200px);
				right: 0;
				top: 0;
				height: 100%;
			}
			#main * {
				margin-left: 10px;
			}
			#main h3 + h5 {
				margin-top: -5px;
				margin-bottom: 15px;
			}
			#main h5:not(#main h3 + h5) {
				margin-bottom: 15px;
			}
			#main img {
				width: calc(50% - 20px);
				aspect-ratio: 677 / 379;
				border-radius: 5px;
				margin-bottom: 10px;
				cursor: pointer;
			}
			#main, #main > div {
				overflow-y: scroll;
			}

			img.selected {
				outline: 2px solid lightgreen;
			}
			#main > div {
				padding-bottom: 20px;
			}

			#main > div {
				display: none;
			}
			#main > div.active-p {
				display: block;
			}

			select {
				display: block;
				width: calc(100% - 30px);
				background-color: rgba(255, 255, 255, 0.1);
				border-radius: 5px;
				padding: 10px;
				font-size: 15px;
				font-family: "Montserrat";
				transition: all 0.2s;
				outline: 0px solid rgba(100,100,255,0.5);
			}
			select:focus {
				outline: 2px solid rgba(100,100,255,0.5);
			}
			ul li:not(.show, li:has(input)) {
				display: none;
			}
			label:has(h5) {
				margin: 0 !important;
				display: inline-block;
				vertical-align: middle;
			}
			label > h5 {
				margin-top: 12px;
			}
			input[type="checkbox"] {
				display: inline-block;
				width: auto;
				vertical-align: middle;
			}

			#storage_usage {
				margin: 0;
			}

			#storage {
				background-color: rgba(50, 50, 50, 0.5);
				overflow: hidden;
				width: calc(100% - 40px);
				border-radius: 5px;
				padding: 0;
			}
			#storage > div {
				padding: 15px;
				padding-left: 0;
				padding-right: 0;
				background-color: rgba(50, 50, 100, 0.8);
				width: 1%;
				margin: 0;
			}
			#storage + p {
				font-size: 11px;
				text-align: right;
				width: calc(100% - 40px);
			}

			table th {
				text-align: left;
			}
			table td {
				text-align: right;
			}
			table {
				width: calc(100% - 40px);
				font-size: 13px;
				table-layout: fixed;
			}
		</style>
	</head>
	<body>

		<div id="sidebar">
			<ul>
				<li><input type="text" id="srchbar" placeholder="Search..."></li>
				<li data-id="personalisation" class="active show">Personalisation</li>
				<li data-id="dateandtime" class="show">Date & Time</li>
				<li data-id="storage" class="show">Storage</li>
				<li data-id="battery" class="show">Battery</li>
			</ul>
		</div>
		<div id="main">
			<div data-id="personalisation" class="active-p">
				<h3>Personalisation</h3>
				<h5>Background</h5>
				<img src="/assets/img/bg5.avif" class="selected bg">
				<img src="/assets/img/bg4.jpg" class="bg">
				<img src="/assets/img/bg3.png" class="bg">
				<img src="/assets/img/bg2.jpg" class="bg">
				<img src="/assets/img/bg.webp" class="bg">
			</div>
			<div data-id="dateandtime">
				<h3>Date & Time</h3>
				<h5>Time Format</h5>
				<select id="timeFormat">
					<option value="true">12-hour</option>
					<option value="false">24-hour</option>
				</select>
				<h5>Date Format</h5>
				<select id="dateFormat">
					<option value="en-GB">Date/Month/Year</option>
					<option value="en-US">Month/Date/Year</option>
				</select>
			</div>
			<div data-id="storage">
				<h3>Storage</h3>
				<h5>Percentage Used (<span id="storage_usage"></span>% used)</h5>
				<div id="storage">
					<div></div>
				</div>
				<p id="st_usage"></p>
				<h5>Storage Breakdown</h5>
				<table>
					<tr>
						<th>App Memory</th>
						<td>0 MiB</td>
					</tr>
					<tr>
						<th>Files</th>
						<td>0 MiB</td>
					</tr>
				</table>
			</div>
			<div data-id="battery">
				<h3>Battery</h3>
				<label for="show_pc"><h5>Show Battery Percentage</h5></label>
				<input id="show_pc" type="checkbox" checked>
			</div>
		</div>

		<script>
			document.querySelectorAll("ul > li:not(li:has(input))").forEach((el) => {
				el.addEventListener("click", () => {
					document.querySelectorAll("ul > li:not(li:has(input))").forEach((el) => {
						el.classList.remove("active");
						document.querySelector(`div[data-id="${el.getAttribute("data-id")}"]`).classList.remove("active-p");
					});
					el.classList.add("active");
					document.querySelector(`div[data-id="${el.getAttribute("data-id")}"]`).classList.add("active-p");
				});
			});

			document.querySelectorAll(".bg").forEach((el) => {
				el.addEventListener("click", () => {
					document.querySelectorAll(".bg").forEach((el) => {
						el.classList.remove("selected");
					});
					el.classList.add("selected");
					localStorage.setItem("custom_bg", el.src);
				});
			});

			document.getElementById("srchbar").addEventListener("keyup", () => {
				const val = document.getElementById("srchbar").value.toLowerCase();
				document.querySelectorAll("ul > li:not(li:has(input))").forEach((el) => {
					el.classList.remove("show");
					if (el.innerText.toLowerCase().includes(val)) {
						el.classList.add("show");
					}
				});
			});

			document.getElementById("timeFormat").addEventListener("change", () => {
				localStorage.setItem("timeFormat", document.getElementById("timeFormat").value);
			});
			if (localStorage.getItem("timeFormat")) {
				document.getElementById("timeFormat").value = localStorage.getItem("timeFormat");
			}
			document.getElementById("dateFormat").addEventListener("change", () => {
				localStorage.setItem("dateFormat", document.getElementById("dateFormat").value);
			});
			if (localStorage.getItem("dateFormat")) {
				document.getElementById("dateFormat").value = localStorage.getItem("dateFormat");
			}
			document.getElementById("show_pc").addEventListener("change", () => {
				localStorage.setItem("show_pc", document.getElementById("show_pc").checked);
			});
			if (localStorage.getItem("show_pc")) {
				document.getElementById("show_pc").checked = localStorage.getItem("show_pc") == "true";
			}

			function humanFileSize(bytes, si=false, dp=1) {
			  const thresh = si ? 1000 : 1024;

			  if (Math.abs(bytes) < thresh) {
			    return bytes + ' B';
			  }

			  const units = si 
			    ? ['kB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'] 
			    : ['KiB', 'MiB', 'GiB', 'TiB', 'PiB', 'EiB', 'ZiB', 'YiB'];
			  let u = -1;
			  const r = 10**dp;

			  do {
			    bytes /= thresh;
			    ++u;
			  } while (Math.round(Math.abs(bytes) * r) / r >= thresh && u < units.length - 1);


			  return bytes.toFixed(dp) + ' ' + units[u];
			}

			async function loadStorage() {
				const st = await navigator.storage.estimate();
				const ls = Math.round((JSON.stringify(localStorage).length * 2));
				const pc = (Math.round(((st.usage + ls)/st.quota) * 10000) / 10000) * 100;

				document.getElementById("storage_usage").innerText = pc;
				if (pc > 1) {
					document.querySelector("#storage > div").style.width = pc + "%";
				}

				document.getElementById("st_usage").innerText = humanFileSize(st.usage + ls) + "/" + humanFileSize(st.quota);

				document.querySelectorAll("td")[0].innerText = humanFileSize(ls);
				document.querySelectorAll("td")[1].innerText = humanFileSize(st.usage);
			}

			loadStorage();
		</script>
	</body>
</html>
